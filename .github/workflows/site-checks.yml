name: Site checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Links, assets and JSON
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check local links, fragments, screenshot manifests and JSON
        run: python3 scripts/check_site.py

  html:
    name: HTML validation (Nu checker)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VNU_VERSION: 26.10.12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install vnu-jar
        # --ignore-scripts: skip the package's own Java download; setup-java provides it.
        run: npm install --prefix "$RUNNER_TEMP/tools" --no-save --no-audit --no-fund --ignore-scripts "vnu-jar@$VNU_VERSION"
      - name: Validate pages (errors only)
        run: |
          set +e
          java -jar "$RUNNER_TEMP/tools/node_modules/vnu-jar/build/dist/vnu.jar" \
            --errors-only --format gnu *.html projects/*.html > "$RUNNER_TEMP/vnu.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/vnu.txt"
          # Repeat each error as a GitHub annotation on the file and line.
          sed -nE "s|^\"file:${GITHUB_WORKSPACE}/([^\"]+)\":([0-9]+)\.([0-9]+)[^:]*: error: (.*)$|::error file=\1,line=\2,col=\3::\4|p" "$RUNNER_TEMP/vnu.txt"
          [ "$status" -eq 0 ] && echo "No HTML errors."
          exit $status

  a11y:
    name: Accessibility (axe, desktop + 390px)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_VERSION: 1.63.0
      AXE_VERSION: 4.14.0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Playwright and axe-core
        run: |
          npm install --prefix "$RUNNER_TEMP/tools" --no-save --no-audit --no-fund \
            "playwright@$PLAYWRIGHT_VERSION" "axe-core@$AXE_VERSION"
          cd "$RUNNER_TEMP/tools" && npx playwright install --with-deps --only-shell chromium
      - name: Run axe on every page
        # The script serves the repository with python3 -m http.server and resolves
        # playwright/axe-core from the working directory.
        working-directory: ${{ runner.temp }}/tools
        run: node "$GITHUB_WORKSPACE/scripts/a11y.mjs"
